<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perigos Complexos Tormenta 20</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1 class="header-title" id="page-title">Perigos Complexos Tormenta 20</h1>
    <div class="header-btns">
      <a href="../index.html" class="header-home-btn" title="Arsenal do Mestre">🏠 Hub</a>
      <!-- Theme Switcher -->
      <div class="theme-switcher" id="theme-switcher">
        <button class="theme-btn" data-theme="blood" title="Tema Sangue (padrão)">🩸</button>
        <button class="theme-btn" data-theme="dark" title="Tema Sombras (STR escuro)">🌑</button>
        <button class="theme-btn" data-theme="classic" title="Tema Clássico (STR claro)">📜</button>
      </div>
    </div>
  </header>

  <div class="container py-4">

    <!-- Seletor de modo -->
    <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 mb-4">
      <div class="theme-switcher modo-switcher" id="modo-switcher">
        <button class="modo-btn active" data-modo="complexos">⚔️ Perigos Complexos</button>
        <button class="modo-btn" data-modo="diversos">📖 Perigos Diversos</button>
      </div>

      <!-- Seletor de visão (Cards x Tabela) — vale para os dois modos -->
      <div class="theme-switcher visao-switcher" id="visao-switcher" role="group" aria-label="Modo de visualização">
        <button type="button" class="visao-btn active" data-visao="cards" aria-pressed="true" title="Ver em cards">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="1.75" width="5" height="5" rx="1"/><rect x="9.25" y="1.75" width="5" height="5" rx="1"/><rect x="1.75" y="9.25" width="5" height="5" rx="1"/><rect x="9.25" y="9.25" width="5" height="5" rx="1"/></svg>
          Cards
        </button>
        <button type="button" class="visao-btn" data-visao="tabela" aria-pressed="false" title="Ver em tabela">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><path d="M1.75 6.25h12.5M1.75 9.75h12.5M5.75 6.25v7"/></svg>
          Tabela
        </button>
      </div>
    </div>

    <!-- ===================== MODO: PERIGOS COMPLEXOS ===================== -->
    <div id="modo-complexos" class="modo-painel">
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <label for="busca" class="form-label">Busca por Termo</label>
          <input type="text" id="busca" class="form-control" placeholder="Digite um termo..." />
        </div>
        <div class="col-md-3">
          <label for="origem" class="form-label">Local</label>
          <select id="origem" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label for="nd" class="form-label">Nível de Desafio (ND)</label>
          <select id="nd" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label for="ordem" class="form-label">Ordenar por ND</label>
          <select id="ordem" class="form-select">
            <option value="nenhum">Sem ordenação</option>
            <option value="crescente">Crescente</option>
            <option value="decrescente">Decrescente</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label d-block">Fontes</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="incluir-breves" />
            <label class="form-check-label" for="incluir-breves">incluir Breves Jornadas</label>
          </div>
        </div>

      </div>

      <div class="row g-4" id="perigos-container"></div>
      <div id="perigos-tabela" class="tabela-escopo d-none"></div>
    </div>

    <!-- ===================== MODO: PERIGOS DIVERSOS ===================== -->
    <div id="modo-diversos" class="modo-painel d-none">
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="busca-diversos" class="form-label">Busca por Termo</label>
          <input type="text" id="busca-diversos" class="form-control" placeholder="Digite um termo..." />
        </div>
        <div class="col-md-4">
          <label for="categoria-diversos" class="form-label">Categoria</label>
          <select id="categoria-diversos" class="form-select"></select>
        </div>
        <div class="col-md-4">
          <label for="origem-diversos" class="form-label">Fonte</label>
          <select id="origem-diversos" class="form-select"></select>
        </div>
      </div>

      <div id="perigos-diversos-container"></div>
      <div id="perigos-diversos-tabela" class="tabela-escopo d-none"></div>
    </div>
  </div>

  <button id="scroll-top-btn" class="scroll-top-btn" title="Voltar ao topo">↑</button>

  <script src="perigos-diversos.js"></script>
  <script src="script.js"></script>
</body>

</html>
